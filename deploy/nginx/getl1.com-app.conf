# getl1.com + www.getl1.com: the GetL1 Laravel app (SITE_MODE=website until the product launches there).
# Installed by deploy/setup-website.sh. Placeholders __PHP_SOCK__ and __APP_ROOT__ are replaced at install.
# HTTPS is added by certbot (existing certificate "getl1.com"), which also redirects HTTP to HTTPS.

server {
    listen 80;
    server_name getl1.com www.getl1.com;

    root __APP_ROOT__/public;
    index index.php;

    # www → apex
    if ($host = www.getl1.com) {
        return 301 https://getl1.com$request_uri;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    charset utf-8;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Built assets and fonts: cache for a year (file names change on every build).
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:__PHP_SOCK__;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header X-Frame-Options;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_read_timeout 60;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }

    access_log /var/log/nginx/getl1.access.log;
    error_log  /var/log/nginx/getl1.error.log;
}
