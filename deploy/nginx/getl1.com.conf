# getl1.com + www.getl1.com: coming-soon landing page (static HTML + one PHP endpoint)
# Installed by deploy/setup-vps.sh. Placeholders __PHP_SOCK__ and __SITE_ROOT__ are replaced at install.

server {
    listen 80;
    server_name getl1.com www.getl1.com;

    root __SITE_ROOT__/landing/public;
    index index.html;

    # Redirect www → apex (certbot keeps this working after it adds HTTPS)
    if ($host = www.getl1.com) {
        return 301 $scheme://getl1.com$request_uri;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 64k;

    # The only PHP file served on the main domain
    location = /subscribe.php {
        limit_except POST { deny all; }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/subscribe.php;
        fastcgi_param GETL1_DATA_DIR /var/www/getl1-data;
        fastcgi_pass unix:__PHP_SOCK__;
    }

    # Any other .php → 404 (nothing else should execute here)
    location ~ \.php$ { return 404; }

    location ~ /\. { deny all; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/getl1.access.log;
    error_log  /var/log/nginx/getl1.error.log;
}
