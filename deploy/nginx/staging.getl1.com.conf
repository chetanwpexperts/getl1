# staging.getl1.com: Laravel app, password-protected, never indexed.
# Installed by deploy/setup-vps.sh. Placeholders __PHP_SOCK__ and __APP_ROOT__ are replaced at install.

server {
    listen 80;
    server_name staging.getl1.com;

    root __APP_ROOT__/public;
    index index.php;

    # Keep staging private: team login + no search indexing
    auth_basic "GetL1 staging";
    auth_basic_user_file /etc/nginx/.htpasswd-getl1-staging;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    charset utf-8;
    client_max_body_size 20M;   # RFQ attachments, KYC documents

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel health check stays open for uptime monitors
    location = /up {
        auth_basic off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_pass unix:__PHP_SOCK__;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { auth_basic off; default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:__PHP_SOCK__;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }

    access_log /var/log/nginx/getl1-staging.access.log;
    error_log  /var/log/nginx/getl1-staging.error.log;
}
